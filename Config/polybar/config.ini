;═══════════════════════════════════════════════════════════════
;  POLYBAR · "modern"
;  Tema: Catppuccin Mocha (Blue)  ·  XFCE / X11
;═══════════════════════════════════════════════════════════════

[colors]
bg          = #1E1E2E
bg-alt      = #181825
fg          = #CDD6F4
blue        = #89B4FA
lavender    = #B4BEFE
green       = #A6E3A1
yellow      = #F9E2AF
peach       = #FAB387
red         = #F38BA8
gray        = #6C7086
surface     = #313244

;───────────────────────────────────────────────────────────────
;  BARRA
;───────────────────────────────────────────────────────────────
[bar/modern]
monitor         = ${env:MONITOR:}
monitor-fallback =

width           = 100%
height          = 30
offset-x        = 0
offset-y        = 0
bottom          = false
fixed-center    = true

background      = ${colors.bg}
foreground      = ${colors.fg}

; Linha de destaque sutil no topo
line-size       = 2
line-color      = ${colors.blue}

border-size     = 0
radius          = 0

padding-left    = 1
padding-right   = 1
module-margin-left  = 1
module-margin-right = 1

; Fonte única = alinhamento vertical consistente.
; O segundo número (offset) ajusta a altura do glifo.
font-0 = "FiraCode Nerd Font:style=Regular:size=10;2"
font-1 = "Symbols Nerd Font Mono:size=13;3"

modules-left    = workspaces sep window
modules-center  = time
; FIX: "power" saiu de antes da tray para depois, e "tray" foi para o
; fim da lista. Módulos clicáveis vizinhos a uma tray perdem parte da
; sua área de clique (bug conhecido do Polybar) — colocando a tray
; por último, nenhum módulo interativo fica "colado" nela.
modules-right   = player cpu memory xkeyboard audio tray power

separator       =
cursor-click    = pointer
cursor-scroll   = ns-resize

enable-ipc      = true
override-redirect = false
;wm-restack      = generic
; (mantido comentado de propósito: só é necessário em WMs tiling
;  como i3/bspwm — XFCE não precisa e não deve usar isso)

;───────────────────────────────────────────────────────────────
;  ESQUERDA
;───────────────────────────────────────────────────────────────
[module/sep]
type  = custom/text
label = "│"
label-foreground = ${colors.surface}

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click   = true
enable-scroll  = true

format = <label-state>

label-active   = 󰮯
label-active-foreground = ${colors.blue}
label-active-padding    = 1

label-occupied = 󰊠
label-occupied-foreground = ${colors.lavender}
label-occupied-padding    = 1

label-urgent   = 󰀨
label-urgent-foreground = ${colors.red}
label-urgent-padding    = 1

label-empty    = 󰑊
label-empty-foreground = ${colors.gray}
label-empty-padding    = 1

[module/window]
type = internal/xwindow
label = %title:0:45:…%
label-foreground = ${colors.gray}
label-empty = "Área de trabalho"
label-empty-foreground = ${colors.surface}

;───────────────────────────────────────────────────────────────
;  CENTRO
;───────────────────────────────────────────────────────────────
[module/time]
type     = internal/date
interval = 1

date          = %H:%M
date-alt      = %a, %d de %b · %H:%M:%S

label = %date%
label-foreground = ${colors.blue}

;───────────────────────────────────────────────────────────────
;  DIREITA
;───────────────────────────────────────────────────────────────
[module/cpu]
type     = internal/cpu
interval = 2

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
label = %percentage:2%%
label-foreground = ${colors.fg}

[module/memory]
type     = internal/memory
interval = 3

format-prefix = "󰘚 "
format-prefix-foreground = ${colors.yellow}
label = %gb_used%
label-foreground = ${colors.fg}

[module/xkeyboard]
type = internal/xkeyboard

; Oculta num lock e scroll lock para evitar poluição visual
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout> <label-indicator>
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.lavender}

label-layout = %layout%
label-layout-foreground = ${colors.fg}

; Alerta em destaque vermelho apenas quando o CAPS LOCK estiver ativo
label-indicator-on-capslock = " CAPS "
label-indicator-on-capslock-foreground = ${colors.bg}
label-indicator-on-capslock-background = ${colors.red}

;───────────────────────────────────────────────────────────────
;  PLAYER DE MÚSICA (MPRIS via playerctl)
;
;  Aparece somente enquanto há uma música tocando/pausada.
;  Quando nenhum player está ativo, o script não emite nada e o
;  módulo desaparece sozinho da barra.
;
;  Requer:  sudo apt install playerctl
;  Clique esquerdo  = play/pause
;  Clique direito    = próxima faixa
;  Clique do meio    = faixa anterior
;  Scroll para cima/baixo = próxima/anterior
;───────────────────────────────────────────────────────────────
[module/player]
type = custom/script
exec = ~/.config/polybar/scripts/player.sh
tail = true

; FIX: todo comando de clique/scroll precisa terminar em "&".
; Sem isso, o Polybar executa o comando de forma síncrona na mesma
; thread que processa cliques e a system tray — isso é um bug
; conhecido do Polybar (issue #2382) que deixa TODOS os módulos
; (inclusive a tray) sem resposta a clique até reiniciar a barra.
click-left   = playerctl play-pause &
click-right  = playerctl next &
click-middle = playerctl previous &
scroll-up    = playerctl next &
scroll-down  = playerctl previous &

format = <label>
format-background = ${colors.surface}
format-padding = 1
format-margin  = 1

label = %output%
label-foreground = ${colors.green}
label-maxlen = 42

[module/audio]
type = internal/pulseaudio
interval = 5
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
label-volume  = %percentage%%
label-volume-foreground = ${colors.fg}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.peach}

format-muted        = <label-muted>
label-muted         = "󰝟 mudo"
label-muted-foreground = ${colors.red}

; FIX: também precisa do "&" (já estava presente, mantido)
click-right = pavucontrol &

;───────────────────────────────────────────────────────────────
;  POWER
;───────────────────────────────────────────────────────────────
[module/power]
type  = custom/text
label = " 󰐥 "
label-foreground = ${colors.red}
click-left  = xfce4-session-logout &
click-right = xfce4-session-logout --suspend &

;───────────────────────────────────────────────────────────────
;  TRAY  (Polybar 3.6+ — módulo interno)
;
;  tray-size DEVE ser menor que a altura da barra, senão os
;  ícones são descartados silenciosamente.
;  Heroic/Discord/Telegram exigem snixembed rodando (ver autostart.sh).
;
;  FIX: módulo movido para o fim de modules-right (ver acima) para
;  não roubar área de clique dos módulos vizinhos (bug conhecido).
;───────────────────────────────────────────────────────────────
[module/tray]
type = internal/tray

format          = <tray>
tray-spacing    = 6px
tray-size       = 16px
tray-padding    = 2px
tray-background = ${colors.bg}
tray-foreground = ${colors.fg}

;───────────────────────────────────────────────────────────────
;  GLOBAIS
;───────────────────────────────────────────────────────────────
[settings]
screenchange-reload = true
pseudo-transparency = false
compositing-background = source
compositing-foreground = over
compositing-over       = over

[global/wm]
margin-top    = 0
margin-bottom = 0